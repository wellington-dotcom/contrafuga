<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contrafuga</title>
<meta name="description" content="Diário de aproximação: registre o que você está evitando, marque o menor passo e compare previsão com realidade.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contrafuga">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
/* Layout: casca de app iOS. Barra de navegação translúcida no topo, título grande, listas agrupadas, barra de abas na base. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --card-2: #F2F2F7;
  --label: #111114;
  --label-2: rgba(60, 60, 67, .62);
  --label-3: rgba(60, 60, 67, .32);
  --sep: rgba(60, 60, 67, .16);
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .2);
  --accent: #0A8C76;
  --on-accent: #FFFFFF;
  --accent-soft: rgba(10, 140, 118, .12);
  --ring-a: #19C29C;
  --ring-b: #0A8C76;
  --orange: #D96F00;
  --orange-soft: rgba(255, 149, 0, .14);
  --red: #E0352B;
  --bar: rgba(249, 249, 251, .82);
  --shadow: 0 1px 1px rgba(0,0,0,.02), 0 6px 22px rgba(0,0,0,.05);
  --sheet-shadow: 0 -8px 40px rgba(0,0,0,.12);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1C1C1E; --card-2: #2C2C2E; --label: #FFFFFF;
    --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .6);
    --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36);
    --accent: #3DD6B3; --on-accent: #00261E; --accent-soft: rgba(61, 214, 179, .16);
    --ring-a: #6AF5D2; --ring-b: #2BC4A0;
    --orange: #FF9F0A; --orange-soft: rgba(255, 159, 10, .18); --red: #FF453A;
    --bar: rgba(22, 22, 24, .78); --shadow: none; --sheet-shadow: 0 -8px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--label); font-family: var(--f); font-size: 17px; line-height: 1.35; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { flex: none; }

/* Barra de navegação */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: transparent; transition: background .2s ease, box-shadow .2s ease; }
.navbar.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--sep); }
.nav-inner { max-width: 720px; margin: 0 auto; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: 8px; }
.nav-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .18s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.navbar.scrolled .nav-title, .navbar.always .nav-title { opacity: 1; }
.nav-left { justify-self: start; } .nav-right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 8px 8px; display: inline-flex; align-items: center; gap: 2px; border-radius: 10px; }
.nav-btn:active { opacity: .45; }
.nav-btn.icon { width: 44px; height: 44px; justify-content: center; }
.nav-btn.icon span { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }

/* Conteúdo */
main { max-width: 720px; margin: 0 auto; padding: calc(44px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.page { display: grid; gap: 28px; padding-top: 6px; }
.large-head { display: grid; gap: 2px; }
.date-kicker { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.12; }
.section { display: grid; gap: 7px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding-inline: 4px; gap: 12px; }
.section-head h2 { font-size: 22px; font-weight: 700; letter-spacing: .005em; }
.section-head .link { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 0; }
.group-label { font-size: 13px; color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; padding-inline: 16px; }
.group-foot { font-size: 13px; color: var(--label-2); padding-inline: 16px; line-height: 1.4; }

.card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 11px 16px; width: 100%; background: none; border: 0; text-align: left; color: var(--label); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.cell.indent + .cell.indent::before { left: 60px; }
button.cell { transition: background .15s ease; }
button.cell:active { background: var(--fill); }
.cell-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cell-title { font-size: 17px; line-height: 1.3; }
.cell-sub { font-size: 14px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-value { color: var(--label-2); font-size: 17px; white-space: nowrap; }
.chev { width: 8px; height: 14px; color: var(--label-3); }
.cell.danger { color: var(--red); justify-content: center; }
.cell.action { color: var(--accent); }
.cell-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; min-height: 50px; padding: 0 22px; font-size: 17px; font-weight: 600; transition: transform .35s var(--spring), opacity .15s ease; }
.btn:active { transform: scale(.96); }
.btn-fill { background: var(--accent); color: var(--on-accent); }
.btn-tint { background: var(--accent-soft); color: var(--accent); }
.btn-plain { background: none; color: var(--accent); min-height: 44px; padding: 0 8px; font-weight: 400; }
.btn-small { min-height: 34px; border-radius: 17px; padding: 0 14px; font-size: 15px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }

/* Hoje: anel da semana */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; padding: 18px; }
.ring-wrap { position: relative; width: 118px; height: 118px; }
.ring-wrap svg { width: 118px; height: 118px; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--accent-soft); stroke-width: 14; }
.ring-prog { fill: none; stroke: url(#ringGrad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .9s var(--spring); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-center b { font-family: var(--f-round); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 12px; color: var(--label-2); margin-top: 3px; }
.hero-stats { display: grid; gap: 10px; min-width: 0; }
.hs { display: grid; gap: 0; }
.hs-k { font-size: 13px; font-weight: 600; color: var(--label); }
.hs-v { font-family: var(--f-round); font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hs-v small { font-size: 15px; font-weight: 600; color: var(--label-2); }
.hs-v.a { color: var(--accent); } .hs-v.o { color: var(--orange); }
@media (max-width: 360px) { .hero { grid-template-columns: minmax(0,1fr); justify-items: center; } .hero-stats { justify-items: center; text-align: center; } }

/* Cartão "fugindo agora" */
.sos { position: relative; overflow: hidden; border-radius: 20px; padding: 20px; color: #fff; background: radial-gradient(120% 140% at 100% 0%, #1E6B5C 0%, #0E2E28 45%, #081714 100%); display: grid; gap: 12px; }
.sos .kick { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: rgba(255,255,255,.62); }
.sos h2 { font-size: 24px; font-weight: 700; line-height: 1.18; max-width: 18ch; }
.sos p { font-size: 15px; color: rgba(255,255,255,.72); max-width: 40ch; }
.sos .btn { background: #fff; color: #0B2F28; justify-self: start; }
.sos svg.deco { position: absolute; right: -8px; top: 14px; width: 150px; opacity: .28; }

/* Agenda */
.when { width: 58px; flex: none; display: grid; gap: 1px; }
.when b { font-family: var(--f-round); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.when span { font-size: 12px; color: var(--label-2); }
.late .when b, .late .when span { color: var(--orange); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.done { background: var(--accent); } .dot.part { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); } .dot.miss { box-shadow: inset 0 0 0 2px var(--orange); } .dot.plan { box-shadow: inset 0 0 0 2px var(--label-3); }

/* Onboarding */
.onboard { display: grid; gap: 14px; justify-items: start; padding: 22px 18px; }
.onboard h2 { font-size: 22px; font-weight: 700; }
.onboard p { color: var(--label-2); font-size: 15px; line-height: 1.45; }
.onboard .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--fill); color: var(--label); white-space: nowrap; }
.tag.a { background: var(--accent-soft); color: var(--accent); }
.tag.o { background: var(--orange-soft); color: var(--orange); }
.tag.ex { background: transparent; box-shadow: inset 0 0 0 1px var(--label-3); color: var(--label-2); }

/* Prova */
.proof { display: grid; gap: 12px; }
.pp { display: grid; gap: 10px; }
.pp-row { display: grid; gap: 2px; }
.pp-k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--label-2); }
.pp-v { font-size: 16px; line-height: 1.4; }
.pp-v.prev { color: var(--label-2); }
.pp-v.struck { text-decoration: line-through; text-decoration-color: var(--orange); text-decoration-thickness: 1.5px; }
.anx { font-size: 14px; color: var(--label-2); line-height: 1.5; }
.anx b { font-family: var(--f-round); color: var(--label); font-size: 16px; }
.lesson { font-family: var(--f-serif); font-style: italic; font-size: 19px; line-height: 1.35; }

/* Fugas */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.segmented button { border: 0; background: none; border-radius: 7px; padding: 6px 4px; font-size: 13px; font-weight: 500; color: var(--label); white-space: nowrap; transition: background .2s ease; }
.segmented button[aria-pressed="true"] { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }
@media (prefers-color-scheme: dark) { .segmented button[aria-pressed="true"] { background: #636366; } }
.fuga-card { display: grid; gap: 12px; text-align: left; border: 0; width: 100%; color: var(--label); transition: transform .35s var(--spring); }
.fuga-card:active { transform: scale(.985); }
.fuga-card h3 { font-size: 19px; font-weight: 600; line-height: 1.28; }
.fuga-meta { font-size: 14px; color: var(--label-2); line-height: 1.4; }
.fuga-foot { display: flex; align-items: center; gap: 10px; border-top: .5px solid var(--sep); padding-top: 12px; font-size: 14px; color: var(--label-2); }
.fuga-foot b { color: var(--label); font-weight: 600; }
.fuga-foot .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Pauta dos degraus */
.staff svg { width: 100%; height: 54px; display: block; }
.staff .l { stroke: var(--sep); stroke-width: 1; }
.staff .n-done { fill: var(--accent); }
.staff .n-part { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.staff .n-plan { fill: var(--card); stroke: var(--label-2); stroke-width: 1.5; }
.staff .n-miss { fill: none; stroke: var(--orange); stroke-width: 1.6; }
.staff .s-done { stroke: var(--accent); stroke-width: 1.5; }
.staff .s-plan { stroke: var(--label-2); stroke-width: 1.2; }
.staff .s-miss { stroke: var(--orange); stroke-width: 1.2; }
.staff-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--label-2); margin-top: 4px; }
.staff-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* Provas */
.verdict { font-family: var(--f-serif); font-size: 26px; line-height: 1.22; font-weight: 600; }
.verdict em { color: var(--accent); font-style: italic; }
.dumb { display: grid; gap: 14px; }
.dumb-row { display: grid; gap: 6px; }
.dumb-lab { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.dumb-lab b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dumb-lab span { color: var(--label-2); font-family: var(--f-round); white-space: nowrap; }
.track { position: relative; height: 18px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 2px; background: var(--fill); }
.track .seg { position: absolute; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 2px; background: var(--label-3); }
.track .pt { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); }
.track .pt.exp { background: var(--card); box-shadow: inset 0 0 0 3px var(--orange); }
.track .pt.real { background: var(--accent); box-shadow: 0 0 0 2px var(--card); }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--label-2); font-family: var(--f-round); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--label-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.legend i.exp { box-shadow: inset 0 0 0 3px var(--orange); } .legend i.real { background: var(--accent); }

/* Detalhe */
.detail-title { font-size: 28px; font-weight: 700; line-height: 1.18; }
.kv-cell { display: grid; gap: 3px; padding: 12px 16px; position: relative; }
.kv-cell + .kv-cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.kv-cell .k { font-size: 13px; color: var(--label-2); }
.kv-cell .v { font-size: 16px; line-height: 1.4; }
.mv { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 12px; padding: 12px 16px; position: relative; align-items: start; }
.mv + .mv::before { content: ""; position: absolute; top: 0; left: 42px; right: 0; height: .5px; background: var(--sep); }
.mv .dot { margin-top: 5px; }
.mv-body { display: grid; gap: 4px; min-width: 0; }
.mv-body b { font-weight: 600; font-size: 16px; }
.mv-body .meta { font-size: 13px; color: var(--label-2); }
.mv-body .txt { font-size: 15px; }
.mv-body .btn { justify-self: start; margin-top: 4px; }

/* Método */
.prose { display: grid; gap: 10px; font-size: 16px; line-height: 1.5; }
.prose ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.cycle svg { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
.cycle text { font-family: var(--f); font-size: 13px; fill: var(--label); }
.cycle .node { fill: var(--card-2); }
.cycle .node.hot { fill: var(--orange-soft); }
.cycle .arc { fill: none; stroke: var(--label-3); stroke-width: 1.6; }
.cycle .arrow { fill: var(--label-3); }
.quote { font-family: var(--f-serif); font-style: italic; font-size: 22px; line-height: 1.3; }

/* Ajustes */
.stepper { display: inline-flex; background: var(--fill); border-radius: 9px; overflow: hidden; }
.stepper button { width: 46px; height: 32px; border: 0; background: none; font-size: 20px; color: var(--label); }
.stepper button + button { border-left: .5px solid var(--sep); }
.stepper button:active { background: var(--fill-2); }

/* Barra de abas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 -.5px 0 var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 52px; }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--label-2); font-size: 10px; font-weight: 500; letter-spacing: 0; padding-top: 4px; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab:active svg { transform: scale(.9); }
.tab svg { transition: transform .3s var(--spring); }

/* Folhas */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.32); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 10px); background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: var(--sheet-shadow); display: flex; flex-direction: column; overflow: hidden; }
.sheet-back.enter { animation: fadeIn .25s ease both; }
.sheet-back.enter .sheet { animation: slideUp .42s cubic-bezier(.2, .9, .25, 1) both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
@media (min-width: 700px) { .sheet-back { align-items: center; padding: 24px; } .sheet { border-radius: 14px; max-height: 88vh; } }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 6px auto 0; flex: none; }
.sheet-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 8px 6px; flex: none; }
.sheet-nav .nav-btn:last-child { justify-self: end; font-weight: 600; }
.sheet-nav .nav-btn[disabled] { color: var(--label-3); }
.sheet-title { font-weight: 600; font-size: 17px; text-align: center; }
.dots { display: flex; gap: 6px; justify-content: center; padding-bottom: 6px; flex: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); transition: background .2s ease, width .3s var(--spring); }
.dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; grid-auto-rows: max-content; gap: 22px; align-content: start; flex: 1 1 auto; min-height: 0; }
.q { font-size: 28px; font-weight: 700; line-height: 1.16; }
.help { font-size: 15px; color: var(--label-2); line-height: 1.45; }
.field { display: grid; gap: 7px; }
.field-label { font-size: 13px; color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; padding-inline: 16px; }
.field-foot { font-size: 13px; color: var(--label-2); padding-inline: 16px; line-height: 1.4; }
.input { width: 100%; background: var(--card); border: 0; border-radius: 12px; padding: 13px 16px; font-size: 17px; line-height: 1.4; color: var(--label); }
textarea.input { min-height: 96px; resize: none; }
.input::placeholder { color: var(--label-3); }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--card); border-radius: 18px; padding: 8px 14px; font-size: 15px; color: var(--label); box-shadow: var(--shadow); transition: transform .3s var(--spring), background .15s ease; }
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

<script>

    SP.first = false;
    if (SP.phase === "form") {
      h += "<h2>O que você está evitando agora?</h2><p class=\"help\">Sem análise longa. Nomeie, escolha a versão pequena e comece.</p>" +
        field("Estou evitando", '<input class="input" type="text" id="sp-ev" data-spbind="evitando" value="' + esc(SP.evitando) + '" placeholder="Ex.: Responder o cliente que pediu desconto">') +
        field("O que não quero sentir", chipsHTML("spSent", SENTIMENTOS, SP.sentimento, true)) +
        field("A versão de 15 minutos disso é", '<input class="input" type="text" id="sp-v" data-spbind="versao" value="' + esc(SP.versao) + '" placeholder="Ex.: Escrever o rascunho da resposta">') +
        '<button class="btn btn-fill btn-block" data-act="sp-start"' + (SP.evitando.trim() && SP.versao.trim() ? "" : " disabled") + ">Começar 15 minutos</button>";
    } else if (SP.phase === "run") {
      var C = 2 * Math.PI * 130;
      h += '<div class="ring-big"><svg viewBox="0 0 280 280" aria-hidden="true"><circle class="bgc" cx="140" cy="140" r="130"/><circle class="fgc" id="spRing" cx="140" cy="140" r="130" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/></svg>' +
        '<div class="time"><b id="spClock">' + fmtClock(SP.total - elapsedNow()) + '</b><span id="spState">' + (SP.running ? "encarando" : "pausado") + "</span></div></div>" +
        '<p class="target">' + esc(SP.versao) + '</p><p class="help" style="text-align:center">Se a vontade de fugir aparecer, ela pode ficar. Você continua mesmo assim.</p>' +
        '<div class="circle-actions"><button class="circle-btn gray" data-act="sp-pause">' + (SP.running ? "Pausar" : "Seguir") + '</button><button class="circle-btn go" data-act="sp-finish">Terminei</button></div>';
    } else if (SP.phase === "end") {
      h += "<h2>Como foi?</h2><p class=\"help\">" + esc(SP.versao) + " · " + Math.max(1, Math.round(elapsedNow() / 60)) + " min</p>" +
        '<div class="sp-choices" data-spres="1">' + [["sim", "Fiz"], ["parcial", "Fiz em parte"], ["nao", "Não fiz"]].map(function (o) { return '<button type="button" data-val="' + o[0] + '" aria-pressed="' + (SP.resultado === o[0]) + '">' + o[1] + "</button>"; }).join("") + "</div>" +
        '<button class="btn btn-fill btn-block" data-act="sp-save"' + (SP.resultado ? "" : " disabled") + ">Registrar</button>";
    } else {
      h += "<h2>" + (SP.resultado === "nao" ? "Registrado. Amanhã tem outra chance." : "Você encostou no que estava evitando.") + "</h2>" +
        '<p class="help">Se isso costuma voltar, vale acompanhar como fuga: você marca degraus e compara previsão com resultado.</p>' +
        '<button class="btn btn-fill btn-block" data-act="sp-tofuga">Acompanhar como fuga</button><button class="btn btn-plain" data-act="sp-close" style="color:#3DD6B3">Fechar</button>';
    }
    $("#sprintRoot").innerHTML = h + "</div></div>";
    if (SP.phase === "run") tick();
  }
  function tick() {
    if (!SP || SP.phase !== "run") return;
    var remain = SP.total - elapsedNow(), clock = $("#spClock"), ring = $("#spRing");
    if (clock) clock.textContent = fmtClock(remain);
    if (ring) { var C = 2 * Math.PI * 130; ring.setAttribute("stroke-dashoffset", (C * (1 - Math.min(1, elapsedNow() / SP.total))).toFixed(1)); }
    if (remain <= 0) { SP.elapsed = SP.total; SP.running = false; stopTick(); releaseWake(); beep(); SP.phase = "end"; SP.resultado = "sim"; renderSprint(); }
  }
  function startTick() { stopTick(); spTimer = setInterval(tick, 250); }
  function stopTick() { if (spTimer) clearInterval(spTimer); spTimer = null; }
  function beep() { try { var A = window.AudioContext || window.webkitAudioContext, ctx = new A(); [0, .22].forEach(function (t) { var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.2, ctx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .18); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2); }); } catch (e) {} }
  function requestWake() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }, function () {}); } catch (e) {} }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && SP && SP.running) { requestWake(); tick(); } });

  /* ---------- Backup ---------- */
  function exportBackup() {
    var payload = JSON.stringify({ app: "contrafuga", version: VERSION, exportedAt: new Date().toISOString(), data: S.data }, null, 2);
    var name = "contrafuga-backup-" + dayKey(new Date()) + ".json";
    var blob = new Blob([payload], { type: "application/json" });
    try {
      var file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: "Backup do Contrafuga" }).catch(function () {}); return; }
    } catch (e) {}
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast("Backup salvo em Downloads.");
  }
  function importBackup(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result), d = j.data || j;
        if (!Array.isArray(d.fugas)) throw new Error("formato");
        var byId = {}; fugas().forEach(function (f) { byId[f.id] = f; });
        d.fugas.forEach(function (f) { if (f && f.id && f.situacao) byId[f.id] = f; });
        S.data.fugas = Object.keys(byId).map(function (k) { return byId[k]; });
        var sp = {}; S.data.sprints.forEach(function (s) { sp[s.id] = s; }); (d.sprints || []).forEach(function (s) { if (s && s.id) sp[s.id] = s; });
        S.data.sprints = Object.keys(sp).map(function (k) { return sp[k]; });
        if (d.settings && d.settings.meta) S.data.settings.meta = d.settings.meta;
        persist(); render(); toast("Backup importado: " + d.fugas.length + " " + plural(d.fugas.length, "fuga", "fugas") + ".");
      } catch (e) { toast("Esse arquivo não é um backup do Contrafuga."); }
    };
    r.readAsText(file);
  }
  $("#importFile").addEventListener("change", function (e) { var f = e.target.files && e.target.files[0]; if (f) importBackup(f); e.target.value = ""; });

  /* ---------- Eventos ---------- */
  function goTab(t) { transition(function () { S.tab = t; S.detail = null; S.metodo = false; try { localStorage.setItem(KEY + ":tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }); }

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var al = t.closest("[data-alert]");
    if (al) { var cb = alertCb; alertCb = null; $("#alertRoot").innerHTML = ""; if (al.dataset.alert === "ok" && cb) cb(); return; }
    var tab = t.closest(".tab"); if (tab) { if (S.tab === tab.dataset.tab && !S.detail && !S.metodo) { window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); return; } goTab(tab.dataset.tab); return; }
    var go = t.closest("[data-go]"); if (go) { goTab(go.dataset.go); return; }
    var fl = t.closest("[data-filtro]"); if (fl) { S.filtro = fl.dataset.filtro; render(); return; }
    if (t.classList && t.classList.contains("sheet-back")) { closeSheet(); return; }

    var chip = t.closest(".chip");
    if (chip) {
      var group = chip.parentElement, name = group.dataset.chips, val = chip.dataset.val, single = !!group.dataset.single;
      var target = name === "spSent" ? SP : name === "pesou" ? CK.d : W.d, key = name === "spSent" ? "sentimento" : name;
      if (single) { target[key] = target[key] === val ? "" : val; $$(".chip", group).forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.val === target[key]); }); }
      else { var arr = target[key] || [], i = arr.indexOf(val); if (i >= 0) arr.splice(i, 1); else arr.push(val); target[key] = arr; chip.setAttribute("aria-pressed", i < 0); }
      return;
    }
    var sg = t.closest("[data-seg] button");
    if (sg) {
      var sname = sg.parentElement.dataset.seg; CK.d[sname] = sg.dataset.val; CK.err = "";
      if (sname === "fiz") { renderCheckin(); return; }
      $$("button", sg.parentElement).forEach(function (b) { b.setAttribute("aria-pressed", b === sg); });
      return;
    }
    var rd = t.closest("[data-radio] .cell");
    if (rd) { CK.d[rd.parentElement.dataset.radio] = rd.dataset.val; $$(".cell", rd.parentElement).forEach(function (c) { c.setAttribute("aria-checked", c === rd); }); return; }
    var sz = t.closest("[data-sizes] button");
    if (sz) { var v = +sz.dataset.val; if ($("#sheetRoot").dataset.kind === "step" && ST) ST.d.dificuldade = v; else if (W) W.d.dificuldade = v; $$("button", sz.parentElement).forEach(function (b) { b.setAttribute("aria-pressed", b === sz); }); return; }
    var spr = t.closest("[data-spres] button");
    if (spr) { SP.resultado = spr.dataset.val; renderSprint(); return; }

    var a = t.closest("[data-act]"); if (!a) return;
    var act = a.dataset.act, fid = a.dataset.f;
    switch (act) {
      case "new": openWizard(); break;
      case "close": closeSheet(); break;
      case "w-next": var e = wValidate(); if (e) { W.err = e; renderWizard(); break; } W.err = ""; W.step++; renderWizard(); break;
      case "w-back": W.err = ""; W.step--; renderWizard(); break;
      case "w-save": wSave(); break;
      case "step": openStep(fid); break;
      case "s-save": stepSave(); break;
      case "checkin": openCheckin(fid, a.dataset.m); break;
      case "c-save": checkinSave(); break;
      case "detail": transition(function () { S.detail = fid; render(); window.scrollTo(0, 0); }); break;
      case "back": transition(function () { S.detail = null; render(); window.scrollTo(0, 0); }); break;
      case "metodo": transition(function () { S.metodo = true; render(); window.scrollTo(0, 0); }); break;
      case "back-ajustes": transition(function () { S.metodo = false; render(); window.scrollTo(0, 0); }); break;
      case "edit": openWizard(null, fid); break;
      case "status":
        var f = clone(findFuga(fid)); f.status = a.dataset.s; saveFuga(f);
        toast(f.status === "superada" ? "Marcada como superada." : f.status === "arquivada" ? "Fuga arquivada." : "Fuga reativada.");
        break;
      case "del":
        confirmAlert("Excluir esta fuga?", "Todos os movimentos dela serão apagados deste aparelho.", "Excluir", function () { deleteFuga(fid); transition(function () { S.detail = null; render(); }); toast("Fuga excluída."); });
        break;
      case "examples": loadExamples(); render(); toast("Exemplos carregados."); break;
      case "del-examples": S.data.fugas = fugas().filter(function (x) { return !x.exemplo; }); persist(); render(); toast("Exemplos apagados."); break;
      case "wipe": confirmAlert("Apagar todos os dados?", "Fugas, movimentos e sessões serão apagados deste aparelho. Exporte um backup antes se quiser guardar.", "Apagar", function () { S.data = emptyData(); persist(); render(); toast("Tudo apagado."); }); break;
      case "meta": S.data.settings.meta = Math.max(1, Math.min(21, (S.data.settings.meta || 5) + (+a.dataset.d))); persist(); render(); break;
      case "export": exportBackup(); break;
      case "import": $("#importFile").click(); break;
      case "sprint": openSprint(); break;
      case "sp-close": closeSprint(); break;
      case "sp-start": SP.phase = "run"; SP.running = true; SP.startedAt = Date.now(); requestWake(); renderSprint(); startTick(); break;
      case "sp-pause":
        if (SP.running) { SP.elapsed = elapsedNow(); SP.running = false; stopTick(); } else { SP.running = true; SP.startedAt = Date.now(); startTick(); }
        a.textContent = SP.running ? "Pausar" : "Seguir"; var sst = $("#spState"); if (sst) sst.textContent = SP.running ? "encarando" : "pausado";
        break;
      case "sp-finish": SP.elapsed = elapsedNow(); SP.running = false; stopTick(); releaseWake(); SP.phase = "end"; SP.resultado = "sim"; renderSprint(); break;
      case "sp-save":
        S.data.sprints.push({ id: uid(), createdAt: new Date().toISOString(), evitando: SP.evitando.trim(), versao: SP.versao.trim(), sentimento: SP.sentimento || "", resultado: SP.resultado, segundos: Math.round(SP.elapsed) });
        persist(); render(); SP.phase = "done"; renderSprint();
        break;
      case "sp-tofuga": var pre = { situacao: SP.evitando, sentimentos: SP.sentimento ? [SP.sentimento] : [] }; closeSprint(); openWizard(pre); break;
    }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.dataset.bind && W) W.d[t.dataset.bind] = t.value;
    else if (t.dataset.sbind && ST) ST.d[t.dataset.sbind] = t.value;
    else if (t.dataset.cbind && CK) CK.d[t.dataset.cbind] = t.value;
    else if (t.dataset.spbind && SP) { SP[t.dataset.spbind] = t.value; var gob = $('[data-act="sp-start"]'); if (gob) gob.disabled = !(SP.evitando.trim() && SP.versao.trim()); }
    if (t.type === "range") {
      var out = $("#" + t.id + "-o"); if (out) out.textContent = t.value;
      if (t.id === "w-intensidade") W.d.intensidade = +t.value;
      if (t.id === "w-ans") W.d.ansiedadeEsperada = +t.value;
      if (t.id === "s-ans") ST.d.ansiedadeEsperada = +t.value;
      if (t.id === "c-ans") CK.d.ansiedade = +t.value;
    }
    if (t.id === "c-crit" && CK) CK.d.criterio = t.checked;
  });
  document.addEventListener("change", function (ev) { if (ev.target.id === "c-crit" && CK) CK.d.criterio = ev.target.checked; });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if ($("#alertRoot").firstChild) { $("#alertRoot").innerHTML = ""; alertCb = null; return; }
    if (SP && SP.phase !== "run") { closeSprint(); return; }
    if ($("#sheetRoot").firstChild) closeSheet();
  });

  /* ---------- Início ---------- */
  render();
  setInterval(function () { if (!$("#sheetRoot").firstChild && !SP && S.tab === "hoje") render(); }, 60000);
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
